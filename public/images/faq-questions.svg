<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-labelledby="faqArtTitle">
  <title id="faqArtTitle">A rising thread of questions answered — messaging bubbles in the brand palette</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#08152E"/>
      <stop offset="1" stop-color="#0E2244"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#a1cbe3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a1cbe3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#a1cbe3" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#a1cbe3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a1cbe3"/>
      <stop offset="1" stop-color="#7fb8d4"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" fill="url(#glow)"/>
  <rect width="900" height="1200" fill="url(#glow2)"/>

  <!-- faint oversized question mark -->
  <text x="470" y="900" font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-size="820" font-weight="700" fill="#a1cbe3" fill-opacity="0.06"
        text-anchor="middle">?</text>

  <!-- question bubble 1 -->
  <g filter="url(#soft)">
    <rect x="96" y="286" width="392" height="128" rx="30" fill="#0E2244" stroke="#142D58" stroke-width="1.5"/>
  </g>
  <circle cx="150" cy="350" r="23" fill="url(#blue)"/>
  <text x="150" y="360" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="28" fill="#08152E">?</text>
  <rect x="196" y="322" width="258" height="14" rx="7" fill="#1B3A6E"/>
  <rect x="196" y="348" width="198" height="14" rx="7" fill="#142D58"/>
  <rect x="196" y="374" width="222" height="14" rx="7" fill="#142D58"/>

  <!-- answer bubble 1 -->
  <g filter="url(#soft)">
    <rect x="412" y="452" width="392" height="128" rx="30" fill="url(#blue)"/>
  </g>
  <circle cx="756" cy="516" r="23" fill="#08152E"/>
  <path d="M745 516 l8 9 l15 -18" fill="none" stroke="#a1cbe3" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="452" y="488" width="258" height="14" rx="7" fill="#08152E" opacity="0.55"/>
  <rect x="452" y="514" width="198" height="14" rx="7" fill="#08152E" opacity="0.40"/>
  <rect x="452" y="540" width="222" height="14" rx="7" fill="#08152E" opacity="0.40"/>

  <!-- question bubble 2 -->
  <g filter="url(#soft)">
    <rect x="140" y="618" width="372" height="128" rx="30" fill="#0E2244" stroke="#142D58" stroke-width="1.5"/>
  </g>
  <circle cx="194" cy="682" r="23" fill="url(#blue)"/>
  <text x="194" y="692" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="28" fill="#08152E">?</text>
  <rect x="240" y="654" width="240" height="14" rx="7" fill="#1B3A6E"/>
  <rect x="240" y="680" width="184" height="14" rx="7" fill="#142D58"/>
  <rect x="240" y="706" width="208" height="14" rx="7" fill="#142D58"/>

  <!-- answer bubble 2 -->
  <g filter="url(#soft)">
    <rect x="368" y="784" width="392" height="128" rx="30" fill="url(#blue)"/>
  </g>
  <circle cx="712" cy="848" r="23" fill="#08152E"/>
  <path d="M701 848 l8 9 l15 -18" fill="none" stroke="#a1cbe3" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="408" y="820" width="258" height="14" rx="7" fill="#08152E" opacity="0.55"/>
  <rect x="408" y="846" width="198" height="14" rx="7" fill="#08152E" opacity="0.40"/>
  <rect x="408" y="872" width="222" height="14" rx="7" fill="#08152E" opacity="0.40"/>

  <!-- accent dots -->
  <circle cx="806" cy="356" r="6" fill="#a1cbe3" fill-opacity="0.55"/>
  <circle cx="846" cy="396" r="4" fill="#a1cbe3" fill-opacity="0.35"/>
  <circle cx="104" cy="1000" r="6" fill="#a1cbe3" fill-opacity="0.45"/>
  <circle cx="64"  cy="1038" r="4" fill="#a1cbe3" fill-opacity="0.28"/>
</svg>
